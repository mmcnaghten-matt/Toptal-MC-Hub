steps:
  # 1. Build the Docker image, injecting your Supabase keys securely
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/toptal-mc-hub:$COMMIT_SHA'
      - '-f'
      - 'dockerfile'
      - '--build-arg'
      - 'VITE_SUPABASE_URL=$(_VITE_SUPABASE_URL)'
      - '--build-arg'
      - 'VITE_SUPABASE_ANON_KEY=$(_VITE_SUPABASE_PUBLISHABLE_KEY)'
      - '.'

  # 2. Push the compiled image into your Google Cloud registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/toptal-mc-hub:$COMMIT_SHA'

  # 3. Force Cloud Run to deploy this brand-new image immediately
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'toptal-mc-hub'
      - '--image'
      - 'gcr.io/$PROJECT_ID/toptal-mc-hub:$COMMIT_SHA'
      - '--region'
      - 'northamerica-northeast2'

images:
  - 'gcr.io/$PROJECT_ID/toptal-mc-hub:$COMMIT_SHA'

# ⚠️ ADD THIS SECTION AT THE VERY BOTTOM:
options:
  logging: CLOUD_LOGGING_ONLY
